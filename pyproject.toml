[project]
name = "agentic-security-framework-lab"
version = "1.3.0"
description = "Framework-neutral lab for evaluating and securing agentic AI workflows"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "agno[openai]>=3.0.5,<3.1",
    "crewai>=1.15.18,<1.16",
    "langchain[openai]>=1.3.18,<1.4",
    "langgraph>=1.2.11,<1.3",
    "llama-index-core>=0.14.24,<0.15",
    "llama-index-llms-openai>=0.7.10,<0.8",
    "llama-index-workflows>=2.23.1,<2.24",
    "pydantic>=2.11.9,<2.13",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "pip-audit>=2.9",
    "pyright>=1.1.411",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_lab"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN", "D", "S"]
ignore = ["ANN401", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101", "ANN"]
"scripts/**/*.py" = ["D"]
# scripts/_vendor_loop_schemas/models.py quotes its `from_dict` classmethods'
# self-referencing return annotations on purpose (see that file's own header
# comment): the quotes are load-bearing on Python 3.12/3.13 and only look
# removable to ruff's UP037 when this project's own target-version is 3.14.
# Suppressed here (not with an inline noqa) because an inline noqa becomes an
# unused-directive RUF100 error on 3.12/3.13, where UP037 never fires.
"scripts/_vendor_loop_schemas/models.py" = ["UP037"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src/agentic_lab --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/agentic_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.engineering-harness.quality]
source-roots = ["src"]
test-roots = ["tests"]
# Exact transitive findings without compatible patched releases are accepted only
# for unreachable features documented under docs/security/*_DEPENDENCY_RISK.md.
dependency-ignore-vulns = [
    "PYSEC-2026-311",
    "GHSA-2wm9-hf6c-p5cr",
    "GHSA-36p7-vc44-83pf",
    "GHSA-xph7-9rjv-w5fr",
    "GHSA-8mgp-746c-j5xp",
]

[tool.engineering-harness.architecture]
source-roots = ["src"]
clean-architecture = true
