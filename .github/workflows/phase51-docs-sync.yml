name: phase51-docs-sync

on:
  push:
    branches:
      - fix/phase-51-mcp-uncertain-execution-failure
    paths:
      - .github/workflows/phase51-docs-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/phase-51-mcp-uncertain-execution-failure
      - name: Apply Phase 51 documentation updates
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          hardened_anchor = (
              "- Authentication-first composition now re-wraps governed executor failures with the exact `credential_verified` evidence and rejects rejected-authentication or context-substitution combinations without copying credential or raw executor content.\n"
          )
          hardened_insert = hardened_anchor + (
              "- Authenticated MCP mutable execution now maps only post-executor `AuthenticatedGovernedActionExecutionError` states to host-visible `MCPError` protocol failures, preventing an uncertain side-effect outcome from becoming an ordinary model-visible Tool error that invites self-directed retry.\n"
          )
          if changelog.count(hardened_anchor) != 1:
              raise SystemExit(f"expected one changelog Hardened anchor, found {changelog.count(hardened_anchor)}")
          changelog = changelog.replace(hardened_anchor, hardened_insert, 1)

          evidence_anchor = (
              "- Authenticated-failure regressions prove base-error compatibility, exact credential-derived context binding, rejected-credential short-circuiting, nested governed/original exception chaining, and absence of the raw API key from structured failure evidence.\n"
          )
          evidence_insert = evidence_anchor + (
              "- Exact isolated `mcp[cli]==2.1.1` compatibility and real STDIO checks prove uncertain authenticated mutable execution raises a protocol `MCPError`, not `CallToolResult(is_error=true)`, while preserving safe authenticated failure evidence in error `data`, zero observed fixture mutation for the failing resource, and a subsequent valid mutation.\n"
              "- The MCP protocol guard removes this failure class from the normal model-correctable Tool-result channel; it does not prove that every host will avoid programmatic retry and does not provide idempotency, rollback, compensation, or distributed transaction semantics.\n"
          )
          if changelog.count(evidence_anchor) != 1:
              raise SystemExit(f"expected one changelog Evidence anchor, found {changelog.count(evidence_anchor)}")
          changelog_path.write_text(changelog.replace(evidence_anchor, evidence_insert, 1))

          adr_path = Path("docs/adr/0007-route-mutable-mcp-tools-through-governed-runtime.md")
          adr = adr_path.read_text()
          context_anchor = (
              "The application already owns framework-neutral contracts for proposed actions, trusted caller context, deterministic authorization, trusted human approval evidence, runtime enforcement, and execution evidence.\n"
          )
          context_insert = context_anchor + (
              "\nA later hardening increment identified a transport-specific retry hazard after authenticated executor-failure evidence was introduced. Ordinary MCP Tool failures are returned through the Tool-result error channel used for model correction. That is appropriate for model-correctable input or Tool failures, but not for a mutable executor that has already been invoked when the external side-effect state is explicitly `unknown`. Returning that state as an ordinary Tool error can invite a model-directed retry of an operation that may already have committed.\n"
          )
          if adr.count(context_anchor) != 1:
              raise SystemExit(f"expected one ADR context anchor, found {adr.count(context_anchor)}")
          adr = adr.replace(context_anchor, context_insert, 1)

          decision_anchor = (
              "A second read-only Tool exposes the synthetic in-memory finding state so transport tests can verify side effects independently from the runtime's own `execution_occurred` field.\n"
          )
          decision_insert = decision_anchor + (
              "\n### Uncertain post-executor failure at the MCP boundary\n\n"
              "For the host-authenticated mutable MCP server, only `AuthenticatedGovernedActionExecutionError` receives special transport handling. The Tool handler catches that error after the governed runtime has already recorded `execution_attempted=true` and `external_side_effect_state=unknown`, then raises a generic MCP protocol `MCPError` with `INTERNAL_ERROR`. Safe `AuthenticatedActionExecutionFailureEvidence` is serialized into protocol error `data`; raw host credentials and the raw executor exception message are not copied into that data.\n\n"
              "This separates two transport meanings:\n\n"
              "```text\n"
              "model-correctable Tool error\n"
              "    !=\n"
              "uncertain mutable execution failure after executor invocation\n"
              "```\n\n"
              "The latter is rejected at the host/protocol boundary rather than returned as a normal `CallToolResult(is_error=true)`. Existing pre-executor paths are unchanged: caller deny, missing human approval, and invalid credentials continue returning their structured governed/authentication results; missing host credential remains the existing host-configuration Tool error.\n\n"
              "This does not create a universal no-retry guarantee. A host can still choose to retry protocol errors in its own code. The boundary only prevents this uncertain mutable outcome from being delivered through the normal model-visible Tool-result error channel. No idempotency key, rollback, compensation, two-phase commit, or distributed transaction is introduced.\n"
          )
          if adr.count(decision_anchor) != 1:
              raise SystemExit(f"expected one ADR decision anchor, found {adr.count(decision_anchor)}")
          adr = adr.replace(decision_anchor, decision_insert, 1)

          security_anchor = (
              "- observable mutation is verified separately through a read-only state Tool.\n"
          )
          security_insert = security_anchor + (
              "- a post-executor failure whose external side-effect state is `unknown` is kept out of the normal model-visible Tool-result retry channel;\n"
              "- MCP protocol failure data preserves safe authenticated governed evidence without raw credential or raw executor-error content.\n"
          )
          if adr.count(security_anchor) != 1:
              raise SystemExit(f"expected one ADR security anchor, found {adr.count(security_anchor)}")
          adr = adr.replace(security_anchor, security_insert, 1)

          evidence_class_anchor = (
              "Phase 25 evidence is provider-free MCP v2 protocol-adapter integration evidence. It is not evidence of remote production readiness, authentication, durable persistence, or benchmark performance.\n"
          )
          evidence_class_insert = evidence_class_anchor + (
              "\nPhase 51 adds provider-free MCP v2.1.1 protocol-failure evidence for the authenticated local STDIO boundary: compatibility and real subprocess checks prove the uncertain post-executor path raises `MCPError`, carries safe structured failure `data`, produces no observed mutation in the controlled missing-resource fixture, and does not appear as a normal model-visible Tool error. This is not proof that an external side effect could not have partially or fully committed, nor that a host will never retry a protocol error.\n"
          )
          if adr.count(evidence_class_anchor) != 1:
              raise SystemExit(f"expected one ADR evidence anchor, found {adr.count(evidence_class_anchor)}")
          adr_path.write_text(adr.replace(evidence_class_anchor, evidence_class_insert, 1))

          security_path = Path("docs/security/GOVERNED_AGENT_ACTIONS.md")
          security = security_path.read_text()
          host_anchor = (
              "A separate read-only state Tool verifies mutation independently after each path. Smoke credentials are generated at runtime, the expected plaintext credential is not committed, and the raw presented credential is not included in returned authentication, authorization, or execution evidence.\n\n"
              "This proves local host-injected service authentication across a real MCP v2 STDIO subprocess. It does not prove remote MCP identity propagation, transport-bound authentication, OAuth/OIDC/JWT/mTLS, production secret management, or end-user identity.\n"
          )
          host_insert = (
              "A separate read-only state Tool verifies mutation independently after each path. Smoke credentials are generated at runtime, the expected plaintext credential is not committed, and the raw presented credential is not included in returned authentication, authorization, or execution evidence.\n\n"
              "### Uncertain mutable failure is host-visible, not model-correctable\n\n"
              "A post-executor failure needs different transport semantics from a normal model-correctable Tool error. If an authenticated governed executor raises after invocation, `AuthenticatedGovernedActionExecutionError` says the execution was attempted but the external side-effect state is `unknown`. Treating that as an ordinary MCP Tool result with `is_error=true` would put the failure into the channel a model can use for self-correction and retry.\n\n"
              "The authenticated MCP handler therefore maps only this governed failure class to `MCPError(INTERNAL_ERROR)` with a generic message and safe `AuthenticatedActionExecutionFailureEvidence` in protocol error `data`. The raw host credential and raw executor exception text are not included in that structured data.\n\n"
              "```text\n"
              "executor invoked + exception + external side-effect state unknown\n"
              "    -> host-visible MCP protocol error\n"
              "    -> no normal model-visible Tool result\n"
              "```\n\n"
              "The exact isolated MCP 2.1.1 compatibility check and real STDIO smoke prove the client receives `MCPError`, not `CallToolResult(is_error=true)`, for the controlled authorized missing-resource case. The separate state Tool observes zero fixture mutations for that case, and a later valid action still executes exactly once. Zero observed fixture mutation is not used to rewrite the runtime's `unknown` external side-effect evidence.\n\n"
              "Other paths keep their existing meanings. Explicit deny, missing human approval, and invalid credentials remain structured governed/authentication results because they stop before the mutable executor. Missing host credential remains the existing host-configuration Tool error.\n\n"
              "This boundary prevents model-directed retry through the normal Tool-result error channel for this specific uncertain failure. It does **not** prove that every MCP host will avoid programmatic retry of protocol errors, and it does not provide idempotency, rollback, compensation, two-phase commit, or distributed transaction guarantees.\n\n"
              "This proves local host-injected service authentication and fail-closed uncertain-execution transport behavior across a real MCP v2 STDIO subprocess. It does not prove remote MCP identity propagation, transport-bound authentication, OAuth/OIDC/JWT/mTLS, production secret management, or end-user identity.\n"
          )
          if security.count(host_anchor) != 1:
              raise SystemExit(f"expected one security host anchor, found {security.count(host_anchor)}")
          security = security.replace(host_anchor, host_insert, 1)

          invariant_anchor = (
              "26. **Local STDIO host injection must not be described as remote or transport-bound authentication.**\n"
          )
          invariant_insert = invariant_anchor + (
              "27. **An authenticated post-executor failure with unknown side-effect state must not be returned through the normal model-visible MCP Tool-error result channel.**\n"
              "28. **MCP protocol failure evidence must not copy raw caller credentials or raw executor exception text.**\n"
          )
          if security.count(invariant_anchor) != 1:
              raise SystemExit(f"expected one security invariant anchor, found {security.count(invariant_anchor)}")
          security_path.write_text(security.replace(invariant_anchor, invariant_insert, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "CHANGELOG.md docs/adr/0007-route-mutable-mcp-tools-through-governed-runtime.md docs/security/GOVERNED_AGENT_ACTIONS.md "
      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs/adr/0007-route-mutable-mcp-tools-through-governed-runtime.md docs/security/GOVERNED_AGENT_ACTIONS.md
          git commit -m "docs: define MCP uncertain execution failure boundary"
          git push origin HEAD:fix/phase-51-mcp-uncertain-execution-failure
