name: phase48-mechanical-fix

on:
  push:
    branches:
      - feat/phase-48-action-evidence-state-machine
    paths:
      - .github/workflows/phase48-mechanical-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-48-action-evidence-state-machine
      - name: Apply exact mechanical corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path("src/agentic_lab/application/action_runtime.py")
          runtime = runtime_path.read_text()
          replacements = {
              '                raise ValueError("allow authorization requires successful direct execution evidence")\n': (
                  '                raise ValueError(\n'
                  '                    "allow authorization requires successful direct execution evidence"\n'
                  '                )\n'
              ),
              '        binding_matches = approval.proposed_action == self.proposed_action and approval.context == self.context\n': (
                  '        binding_matches = (\n'
                  '            approval.proposed_action == self.proposed_action\n'
                  '            and approval.context == self.context\n'
                  '        )\n'
              ),
              '            raise ValueError(f"{status} approval status requires exact-bound human approval evidence")\n': (
                  '            raise ValueError(\n'
                  '                f"{status} approval status requires exact-bound human approval evidence"\n'
                  '            )\n'
              ),
          }
          for old, new in replacements.items():
              count = runtime.count(old)
              if count != 1:
                  raise SystemExit(f"expected one runtime target, found {count}: {old!r}")
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)

          test_path = Path("tests/unit/application/test_action_approver_runtime.py")
          tests = test_path.read_text()
          test_replacements = {
              'match="requires a deny decision"': 'match="requires a deny approver decision"',
              'match="validated approval status requires an allow decision"': (
                  'match="validated approval status requires an allow approver decision"'
              ),
          }
          for old, new in test_replacements.items():
              count = tests.count(old)
              if count != 1:
                  raise SystemExit(f"expected one test target, found {count}: {old!r}")
              tests = tests.replace(old, new, 1)
          test_path.write_text(tests)
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/agentic_lab/application/action_runtime.py tests/unit/application/test_action_approver_runtime.py "
      - name: Commit corrections
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/agentic_lab/application/action_runtime.py tests/unit/application/test_action_approver_runtime.py
          git commit -m "test: align evidence validation expectations"
          git push origin HEAD:feat/phase-48-action-evidence-state-machine
