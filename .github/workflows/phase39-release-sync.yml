name: phase39-release-sync

on:
  push:
    branches:
      - release/phase-39-v1.2.0
    paths:
      - .github/workflows/phase39-release-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: release/phase-39-v1.2.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.28"
      - name: Promote release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("pyproject.toml"): [
                  ('version = "1.1.0"', 'version = "1.2.0"'),
              ],
              Path("CHANGELOG.md"): [
                  ('## Unreleased', '## 1.2.0 - 2026-09-05'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected exactly one match, found {count}: {old!r}"
                      )
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Synchronize lockfile
        run: uv lock
      - name: Verify release-only diff
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          baseline = subprocess.check_output(
              ["git", "show", "HEAD:uv.lock"],
              text=True,
          )
          old = 'name = "agentic-security-framework-lab"\nversion = "1.1.0"'
          new = 'name = "agentic-security-framework-lab"\nversion = "1.2.0"'
          if baseline.count(old) != 1:
              raise SystemExit("uv.lock baseline does not contain exactly one local 1.1.0 entry")
          expected = baseline.replace(old, new, 1)
          actual = Path("uv.lock").read_text()
          if actual != expected:
              raise SystemExit("uv lock changed more than the local editable project version")

          changed = subprocess.check_output(
              ["git", "diff", "--name-only"],
              text=True,
          ).splitlines()
          expected_files = {"CHANGELOG.md", "pyproject.toml", "uv.lock"}
          if set(changed) != expected_files:
              raise SystemExit(f"unexpected release-prep files: {changed!r}")
          PY
          git diff --check
          uv lock --check
      - name: Commit release candidate metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "chore: prepare v1.2.0 release"
          git push origin HEAD:release/phase-39-v1.2.0
