name: phase41-doc-sync

on:
  push:
    branches:
      - fix/phase-41-approval-freshness
    paths:
      - .github/workflows/phase41-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/phase-41-approval-freshness
      - name: Apply exact approval freshness documentation replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "CHANGELOG.md",
              "# Changelog\n\n## 1.2.0 - 2026-09-05",
              "# Changelog\n\n## Unreleased\n\n### Hardened\n\n- Human approval evidence now carries required timezone-aware `approved_at` and `expires_at` timestamps, with a positive validity window enforced at the evidence boundary.\n- `GovernedActionRuntime` validates approval freshness against an application-owned trusted clock using the half-open interval `[approved_at, expires_at)`.\n- Future-dated and expired approvals fail closed as `not_yet_valid` and `expired`; a claimed temporal failure remains consumed so retry requires fresh human evidence.\n- Normal `allow` and terminal `deny` paths neither claim HITL evidence nor consult approval time.\n\n### Evidence\n\n- Deterministic runtime tests cover inclusive issuance, exclusive expiry, future-dated evidence, invalid clock output, anti-replay after temporal failure, and executor-failure semantics without sleeps or wall-clock-dependent tests.\n- The adversarial suite proves an old unused approval cannot authorize a late mutable action, and cross-framework conformance proves expired approval semantics remain identical across the direct runtime, LangGraph, CrewAI, LlamaIndex, and Agno.\n- Approval freshness evidence remains provider-free local/CI evidence; durable approval storage, revocation, multi-party workflow, and distributed transactional atomicity remain outside the current scope.\n\n## 1.2.0 - 2026-09-05",
          )

          path = "docs/adr/0006-treat-human-approval-as-trusted-runtime-evidence.md"
          replace_once(
              path,
              "A later hardening review identified an additional requirement: trusted approval evidence for a mutable action must not be reusable indefinitely. A reusable lookup would allow one human decision to authorize repeated identical side effects.\n",
              "A later hardening review identified an additional requirement: trusted approval evidence for a mutable action must not be reusable indefinitely. A reusable lookup would allow one human decision to authorize repeated identical side effects.\n\nAfter the single-use capability model was in place, a second temporal gap remained: an approval that had never been claimed could stay valid indefinitely. Old human intent must not authorize a much later mutable side effect merely because the approval was still unused.\n",
          )
          replace_once(
              path,
              "- a synthetic approver identifier.\n",
              "- a synthetic approver identifier;\n- one timezone-aware issuance instant `approved_at`;\n- one timezone-aware exclusive expiry instant `expires_at`.\n",
          )
          replace_once(
              path,
              "The runtime then records one of four low-cardinality approval states:\n\n```text\nnot_applicable\nmissing\ninvalid\nvalidated\n```\n\nA matching, validated approval satisfies the runtime precondition and permits execution while preserving the original authorization outcome `require_human_approval` in execution evidence.\n",
              "The runtime then records one of six low-cardinality approval states:\n\n```text\nnot_applicable\nmissing\ninvalid\nnot_yet_valid\nexpired\nvalidated\n```\n\nA matching approval must also be valid at the runtime's trusted current time. Only `validated` evidence satisfies the runtime precondition and permits execution while preserving the original authorization outcome `require_human_approval` in execution evidence.\n",
          )
          replace_once(
              path,
              "### Single-use and failure semantics\n",
              "### Temporal validity\n\nApproval validity uses the half-open interval:\n\n```text\n[approved_at, expires_at)\n```\n\nThe evidence model requires timezone-aware timestamps and rejects `expires_at <= approved_at`. `GovernedActionRuntime` owns freshness enforcement through an injected `ApprovalClock`; the approval provider does not decide whether evidence is temporally valid. Production composition uses a UTC clock while tests inject deterministic fixed time.\n\nIf trusted current time is before `approved_at`, the runtime records `not_yet_valid`. If current time is equal to or later than `expires_at`, it records `expired`. Both outcomes block execution. A clock returning a naive datetime is rejected as an invalid trusted temporal boundary.\n\nTemporal validation happens only after policy requires HITL, one approval has been claimed, and exact action/context binding has been confirmed. Normal `allow`, terminal `deny`, missing approval, and scope-mismatch paths therefore do not depend on time unnecessarily.\n\nA future-dated or expired approval is already claimed when temporal failure is discovered, so it stays consumed. Retry requires fresh human evidence rather than waiting for or resurrecting the same capability.\n\n### Single-use and failure semantics\n",
          )
          replace_once(
              path,
              "- approval persistence, expiry, revocation, and multi-party approval are not modeled yet;\n",
              "- durable approval persistence, revocation, and multi-party approval are not modeled yet;\n- temporal validity is enforced locally, but this does not prove clock synchronization or distributed expiry enforcement across processes;\n",
          )
          replace_once(
              path,
              "require_human_approval + missing/invalid approval = no execution\n\none claimed approval = at most one execution attempt\n",
              "require_human_approval + missing/invalid/not-yet-valid/expired approval = no execution\n\nvalid approval time = approved_at <= trusted_now < expires_at\n\none claimed approval = at most one execution attempt\n",
          )
          replace_once(path, "Refs #131, #145\n", "Refs #131, #145, #163\n")

          path = "docs/security/GOVERNED_AGENT_ACTIONS.md"
          replace_once(
              path,
              "Approval evidence is bound to the exact:\n\n```text\nProposedAction + ActionContext\n```\n",
              "Approval evidence is bound to the exact action/context and a bounded validity window:\n\n```text\nProposedAction + ActionContext + [approved_at, expires_at)\n```\n",
          )
          replace_once(
              path,
              "- `invalid`\n- `validated`\n\nOnly validated, exact-match approval evidence can release an approval-required action for execution.\n",
              "- `invalid`\n- `not_yet_valid`\n- `expired`\n- `validated`\n\nOnly exact-match approval evidence that is valid at trusted runtime time can become `validated` and release an approval-required action for execution.\n",
          )
          replace_once(
              path,
              "The fixture rejects duplicate `approval_id` values and can hold multiple distinct approvals for the same exact scope when multiple executions were separately approved. This is process-local test evidence, not proof of durable or distributed transactional approval infrastructure.\n\n## 5. Runtime enforcement\n",
              "The fixture rejects duplicate `approval_id` values and can hold multiple distinct approvals for the same exact scope when multiple executions were separately approved. This is process-local test evidence, not proof of durable or distributed transactional approval infrastructure.\n\n### Approval freshness\n\nSingle-use prevents replay, but it does not by itself prevent stale authority. `HumanApprovalEvidence` therefore requires timezone-aware `approved_at` and `expires_at`, with `expires_at` strictly later than issuance.\n\n`GovernedActionRuntime` owns freshness through an injected application `ApprovalClock`. The provider still owns only atomic claim semantics; frameworks, model output, and approval storage do not decide whether time is valid. The accepted interval is half-open: `approved_at <= trusted_now < expires_at`.\n\nA claimed approval before its issuance becomes `not_yet_valid`; a claim at or after its expiry becomes `expired`. Neither executes. Both capabilities remain consumed, so retry requires new human evidence. A naive clock result is rejected fail-closed.\n\nTests use deterministic fixed clocks rather than sleeps. The adversarial suite proves that an old unused approval cannot authorize a late mutation, and the framework conformance matrix includes an expired-approval scenario across LangGraph, CrewAI, LlamaIndex, and Agno.\n\nThis proves local application-owned temporal enforcement, not durable revocation, distributed clock synchronization, or production approval workflow infrastructure.\n\n## 5. Runtime enforcement\n",
          )
          replace_once(
              path,
              "    A -->|require_human_approval| H[Claim one unused trusted approval]\n    H -->|missing or invalid| B[Return evidence: no execution]\n    H -->|validated| X\n",
              "    A -->|require_human_approval| H[Claim one unused trusted approval]\n    H -->|missing or invalid| B[Return evidence: no execution]\n    H -->|exact scope| T[Validate trusted approval time]\n    T -->|not yet valid or expired| B\n    T -->|validated| X\n",
          )
          replace_once(
              path,
              "- approval status and approval evidence when present;\n",
              "- approval status, bounded approval evidence, and temporal validity when present;\n",
          )
          PY
      - name: Commit only expected documentation files
        run: |
          git diff --check
          git diff --exit-code -- . \
            ':!CHANGELOG.md' \
            ':!docs/adr/0006-treat-human-approval-as-trusted-runtime-evidence.md' \
            ':!docs/security/GOVERNED_AGENT_ACTIONS.md'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md \
            docs/adr/0006-treat-human-approval-as-trusted-runtime-evidence.md \
            docs/security/GOVERNED_AGENT_ACTIONS.md
          git commit -m "docs: document time-bounded human approval"
          git push origin HEAD:fix/phase-41-approval-freshness
