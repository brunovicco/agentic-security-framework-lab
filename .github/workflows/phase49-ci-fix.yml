name: phase49-ci-fix

on:
  push:
    branches:
      - feat/phase-49-executor-failure-evidence
    paths:
      - .github/workflows/phase49-ci-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-49-executor-failure-evidence
      - name: Migrate failure consumer and lint-safe fixture name
        run: |
          python - <<'PY'
          from pathlib import Path

          integration_path = Path("tests/integration/test_governed_finding_action.py")
          integration = integration_path.read_text()
          old_import = "from agentic_lab.application.action_runtime import GovernedActionRuntime\n"
          new_import = (
              "from agentic_lab.application.action_runtime import (\n"
              "    GovernedActionExecutionError,\n"
              "    GovernedActionRuntime,\n"
              ")\n"
          )
          if integration.count(old_import) != 1:
              raise SystemExit(f"expected one runtime import, found {integration.count(old_import)}")
          integration = integration.replace(old_import, new_import, 1)

          old_test = '''    with pytest.raises(LookupError, match="finding does not exist"):\n        runtime.execute(_action(resource=missing_resource), _context())\n\n    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n    assert executor.execution_count == 0\n'''
          new_test = '''    with pytest.raises(GovernedActionExecutionError) as exc_info:\n        runtime.execute(_action(resource=missing_resource), _context())\n\n    error = exc_info.value\n    evidence = error.evidence\n\n    assert isinstance(error.__cause__, LookupError)\n    assert str(error.__cause__) == "finding does not exist"\n    assert evidence.authorization.outcome == "allow"\n    assert evidence.approval_status == "not_applicable"\n    assert evidence.execution_attempted is True\n    assert evidence.external_side_effect_state == "unknown"\n    assert evidence.failure_reason == "executor_error"\n    assert "finding does not exist" not in evidence.model_dump_json()\n    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n    assert executor.execution_count == 0\n'''
          if integration.count(old_test) != 1:
              raise SystemExit(f"expected one integration test target, found {integration.count(old_test)}")
          integration_path.write_text(integration.replace(old_test, new_test, 1))

          failure_path = Path("tests/unit/application/test_action_execution_failure.py")
          failure = failure_path.read_text()
          old_name = "SECRET_ERROR_TEXT"
          new_name = "EXECUTOR_ERROR_TEXT"
          if failure.count(old_name) != 5:
              raise SystemExit(f"expected five test constant references, found {failure.count(old_name)}")
          failure_path.write_text(failure.replace(old_name, new_name))
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "tests/integration/test_governed_finding_action.py tests/unit/application/test_action_execution_failure.py "
      - name: Commit regression migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/test_governed_finding_action.py tests/unit/application/test_action_execution_failure.py
          git commit -m "test: migrate executor failure expectations"
          git push origin HEAD:feat/phase-49-executor-failure-evidence
