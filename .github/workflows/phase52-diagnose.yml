name: phase52-diagnose

on:
  push:
    branches:
      - fix/phase-52-governed-mcp-uncertain-execution-failure
    paths:
      - .github/workflows/phase52-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --frozen --all-groups
      - name: Capture project quality gate
        shell: bash
        run: |
          set +e
          uv run python scripts/quality_gate.py > phase52-diagnose.txt 2>&1
          status=$?
          set -e
          printf '\nquality_gate_exit=%s\n' "$status" >> phase52-diagnose.txt
      - name: Commit diagnosis only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase52-diagnose.txt
          git diff --cached --check
          git commit -m "chore: capture phase52 quality diagnosis"
          git push
