name: phase38-doc-sync

on:
  push:
    branches:
      - feat/phase-38-host-injected-mcp-authentication
    paths:
      - .github/workflows/phase38-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-38-host-injected-mcp-authentication
      - name: Apply exact Phase 38 documentation replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("CHANGELOG.md"): [
                  (
                      "- Source-aware least-privilege authorization over exact `(caller_id, identity_source, action, resource, environment)` scopes.\n",
                      "- Source-aware least-privilege authorization over exact `(caller_id, identity_source, action, resource, environment)` scopes.\n- A separate provider-free authenticated governed-action MCP v2 STDIO boundary that receives service credential material from trusted host/process environment rather than model-controlled Tool arguments.\n",
                  ),
                  (
                      "- Identity-source mismatches fail closed with no legacy four-field fallback or cross-source authority inheritance; an `api_key` caller requires its own explicit policy rule instead of inheriting `trusted_composition` authority.\n",
                      "- Identity-source mismatches fail closed with no legacy four-field fallback or cross-source authority inheritance; an `api_key` caller requires its own explicit policy rule instead of inheriting `trusted_composition` authority.\n- The API-key fixture can be configured with precomputed SHA-256 verification material, and the authenticated MCP server removes the captured presented credential from its process environment before governed execution.\n- Missing or invalid host credentials fail closed before mutable execution; credentials remain absent from Tool schemas and returned authentication/authorization/execution evidence.\n",
                  ),
                  (
                      "- Trusted-identity, service-authentication, authentication-first runtime, source-confusion adversarial, and cross-framework source-aware conformance checks remain provider-free local/CI evidence and do not claim end-user authentication, OAuth/OIDC, remote MCP identity, or production secrets management.\n",
                      "- Trusted-identity, service-authentication, authentication-first runtime, source-confusion adversarial, and cross-framework source-aware conformance checks remain provider-free local/CI evidence and do not claim end-user authentication, OAuth/OIDC, remote MCP identity, or production secrets management.\n- MCP v2 compatibility and real subprocess STDIO smoke checks prove host-injected service authentication for missing, invalid, denied, approval-required, and allowed paths while independently verifying zero side effects on blocked paths.\n",
                  ),
              ],
              Path("docs/MCP.md"): [
                  (
                      "MCP `ToolAnnotations` remain behavioral metadata/hints. They are not treated as authorization\ndecisions.\n\n## Governance\n",
                      "MCP `ToolAnnotations` remain behavioral metadata/hints. They are not treated as authorization\ndecisions.\n\n### Host-injected authenticated STDIO experiment\n\nPhase 38 adds a separate authenticated governed-action server used only by controlled compatibility\nand subprocess smoke checks. It is deliberately not registered in `.codex/config.toml`, because its\ncredential and verification material belong to the trusted host/process environment rather than\nchecked-in project configuration.\n\nThe host supplies the presented synthetic API key and a precomputed SHA-256 verification digest as\nprocess environment. The server captures the presented credential, removes it from the process\nenvironment, wraps it as `CallerCredential`, and delegates to `AuthenticatedGovernedActionRuntime`.\nThe model-visible `acknowledge_finding` Tool still accepts only `resource` and `environment`; it has\nno credential, API-key, caller-id, identity-source, approval-id, or approver-id field.\n\nThe source-aware policy for this experiment binds authority to `identity_source = api_key`. Real\nSTDIO subprocess checks prove that missing credentials fail closed, invalid credentials return\nrejection evidence with zero mutation, and valid authentication can still be denied, require human\napproval, or execute depending on the exact action scope. A separate read-only state Tool verifies\nside effects independently. Smoke credentials are generated at runtime and no expected plaintext API\nkey is committed.\n\nThis is provider-free local host-injection evidence. It does **not** establish remote MCP identity,\ntransport-bound authentication, OAuth/OIDC/JWT/mTLS, production secret storage, rotation, expiry, or\nend-user identity.\n\n## Governance\n",
                  ),
              ],
              Path("docs/security/GOVERNED_AGENT_ACTIONS.md"): [
                  (
                      "- configured synthetic high-entropy API keys are reduced to SHA-256 digests during construction;\n- the adapter retains digests and caller ids rather than configured plaintext keys;\n",
                      "- configured synthetic high-entropy API keys are reduced to SHA-256 digests during construction;\n- trusted composition can instead provide precomputed SHA-256 verification material, avoiding retention of an expected plaintext key before construction;\n- the adapter retains digests and caller ids rather than configured plaintext keys;\n",
                  ),
                  (
                      "MCP tool annotations are treated only as behavioral metadata. They do not replace application authorization or runtime enforcement.\n\nPhases 35-37 do not route API-key credentials through MCP STDIO. Remote transport authentication remains a separate increment.\n",
                      "MCP tool annotations are treated only as behavioral metadata. They do not replace application authorization or runtime enforcement.\n\n### Host-injected authenticated STDIO boundary\n\nPhase 38 adds a separate provider-free MCP v2 STDIO server for authenticated governed actions. It is intentionally not registered in project `.codex/config.toml`: authentication material belongs to the trusted host/process environment rather than model-visible Tool arguments or checked-in server configuration.\n\nThe host supplies two separate values to the subprocess environment: a presented synthetic service credential and precomputed SHA-256 verification material. The server captures the presented credential, removes that raw value from the process environment, constructs `CallerCredential`, and invokes `AuthenticatedGovernedActionRuntime`.\n\nThe model-visible mutable Tool still accepts only:\n\n```text\nresource\nenvironment\n```\n\nIt cannot supply `credential`, `api_key`, `caller_id`, `identity_source`, `approval_id`, or `approver_id`. The authenticated context is created only after credential verification and carries:\n\n```text\ncaller_id       = local-api-key-client\nidentity_source = api_key\n```\n\nThe exact source-aware policy then independently decides the action. Real subprocess STDIO smoke coverage proves three isolated host cases:\n\n- missing presented credential -> fail-closed Tool error and zero observable mutation;\n- invalid presented credential -> `rejected / credential_rejected`, no execution evidence, and zero observable mutation;\n- valid presented credential -> authentication succeeds, while `staging` is still denied, `production` still requires missing human approval, and only exact `test` scope executes.\n\nA separate read-only state Tool verifies mutation independently after each path. Smoke credentials are generated at runtime, the expected plaintext credential is not committed, and the raw presented credential is not included in returned authentication, authorization, or execution evidence.\n\nThis proves local host-injected service authentication across a real MCP v2 STDIO subprocess. It does not prove remote MCP identity propagation, transport-bound authentication, OAuth/OIDC/JWT/mTLS, production secret management, or end-user identity.\n",
                  ),
                  (
                      "The `api_key` source proves only a matching synthetic service credential in the controlled fixture. Phases 36-37 prove local authentication-first application composition and source-aware authorization, not remote authenticated identity propagation.\n",
                      "The `api_key` source proves only a matching synthetic service credential in the controlled fixture. Phase 38 additionally proves local host-injected authentication across a real MCP v2 STDIO subprocess, while still making no claim of remote authenticated identity propagation or transport-bound authentication.\n",
                  ),
                  (
                      "23. **Framework-specific retries must not silently multiply mutable side effects.**\n\n## 13. How to explain this in an interview\n",
                      "23. **Framework-specific retries must not silently multiply mutable side effects.**\n24. **Host credential material is separate from model-controlled MCP Tool input.**\n25. **Missing or rejected host authentication cannot produce mutable side effects.**\n26. **Local STDIO host injection must not be described as remote or transport-bound authentication.**\n\n## 13. How to explain this in an interview\n",
                  ),
                  (
                      "> \"Once I had two trusted identity sources, caller ID alone stopped being a sufficient authorization key. I kept authentication separate: a credential first derives a trusted `ActionContext`, then authorization matches the exact caller, identity source, action, resource, and environment. There is no cross-source fallback, so an API-key-authenticated caller does not inherit authority granted to the same caller ID under local trusted composition. Failed authentication never reaches policy, successful authentication can still be denied, human approval remains a separate authority, and the same runtime semantics hold across LangGraph, CrewAI, LlamaIndex, Agno, and MCP.\"\n",
                      "> \"Once I had two trusted identity sources, caller ID alone stopped being a sufficient authorization key. I kept authentication separate: a credential first derives a trusted `ActionContext`, then authorization matches the exact caller, identity source, action, resource, and environment. There is no cross-source fallback, so an API-key-authenticated caller does not inherit authority granted to the same caller ID under local trusted composition. At the MCP boundary, the host injects credential material outside the Tool schema, so the model still proposes only action scope. Failed authentication never reaches policy, successful authentication can still be denied, human approval remains a separate authority, and the same runtime semantics hold across LangGraph, CrewAI, LlamaIndex, Agno, and MCP.\"\n",
                  ),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"{path}: no change produced")
              path.write_text(text)
              changed.append(str(path))

          print("updated:", ", ".join(changed))
          PY
      - name: Commit only expected documentation files
        run: |
          git diff --exit-code -- . ':!CHANGELOG.md' ':!docs/MCP.md' ':!docs/security/GOVERNED_AGENT_ACTIONS.md'
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs/MCP.md docs/security/GOVERNED_AGENT_ACTIONS.md
          git commit -m "docs: document host-injected MCP authentication"
          git push origin HEAD:feat/phase-38-host-injected-mcp-authentication
