name: phase47-format-fix

on:
  push:
    branches:
      - feat/phase-47-approver-authorization
    paths:
      - .github/workflows/phase47-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-47-approver-authorization
      - name: Remove one excess blank line
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/integration/test_adversarial_action_authorization.py")
          text = path.read_text()
          old = (
              "    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n"
              "\n\n\n"
              "def test_unentitled_human_approver_cannot_authorize_mutation() -> None:\n"
          )
          new = (
              "    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n"
              "\n\n"
              "def test_unentitled_human_approver_cannot_authorize_mutation() -> None:\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one exact formatting target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" = "1"
          test "$(git diff --name-only)" = "tests/integration/test_adversarial_action_authorization.py"
      - name: Commit formatting correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/integration/test_adversarial_action_authorization.py
          git commit -m "style: normalize phase47 adversarial test spacing"
          git push origin HEAD:feat/phase-47-approver-authorization
