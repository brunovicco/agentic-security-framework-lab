name: phase47-fixture-migration

on:
  push:
    branches:
      - feat/phase-47-approver-authorization
    paths:
      - .github/workflows/phase47-fixture-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-47-approver-authorization
      - name: Migrate controlled approval fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          # New tests: typing/formatting fixes from CI #418.
          path = "tests/unit/application/test_action_approver_authorization.py"
          replace(
              path,
              "    ApproverAuthorizationRuleKey,\n",
              "    ApproverAuthorizationOutcome,\n    ApproverAuthorizationRuleKey,\n",
          )
          replace(
              path,
              '    rules = {RULE: "allow"}\n',
              '    rules: dict[ApproverAuthorizationRuleKey, ApproverAuthorizationOutcome] = {\n        RULE: "allow"\n    }\n',
          )

          path = "tests/unit/application/test_action_approver_runtime.py"
          replace(
              path,
              "from agentic_lab.application.action_approval import ApprovalClaim, HumanApprovalEvidence\n",
              "from agentic_lab.application.action_approval import (\n    ApprovalClaim,\n    ApprovalClaimStatus,\n    HumanApprovalEvidence,\n)\n",
          )
          replace(
              path,
              "        self._status = status\n",
              "        self._status: ApprovalClaimStatus = status\n",
          )
          replace(
              path,
              'def _context(identity_source: Literal["trusted_composition", "api_key"] = "trusted_composition") -> ActionContext:\n',
              'def _context(\n    identity_source: Literal["trusted_composition", "api_key"] = "trusted_composition",\n) -> ActionContext:\n',
          )

          # Application runtime legacy tests: only paths that must progress to time/execution.
          path = "tests/unit/application/test_action_runtime.py"
          replace(
              path,
              "from agentic_lab.application.action_authorization import (\n",
              "from agentic_lab.application.action_approver_authorization import (\n    StaticActionApproverAuthorizationPolicy,\n)\nfrom agentic_lab.application.action_authorization import (\n",
          )
          marker = "def _context(caller_id: str = REMEDIATION_AGENT) -> ActionContext:\n"
          helper = '''def _approver_authorizer() -> StaticActionApproverAuthorizationPolicy:\n    return StaticActionApproverAuthorizationPolicy(\n        {\n            (\n                "soc-reviewer",\n                REMEDIATION_AGENT,\n                "trusted_composition",\n                "create_remediation_task",\n                REMEDIATION_RESOURCE,\n                "production",\n            ): "allow"\n        }\n    )\n\n\n'''
          replace(path, marker, helper + marker)
          replace(
              path,
              "        approval_clock=clock,\n    )\n",
              "        approval_clock=clock,\n        approver_authorizer=_approver_authorizer(),\n    )\n",
              count=5,
          )
          replace(
              path,
              "        approval_clock=FixedApprovalClock(datetime(2026, 9, 5, 20, 5)),\n    )\n",
              "        approval_clock=FixedApprovalClock(datetime(2026, 9, 5, 20, 5)),\n        approver_authorizer=_approver_authorizer(),\n    )\n",
          )

          # Adversarial suite: exact explicit reviewer entitlement for intended production paths.
          path = "tests/integration/test_adversarial_action_authorization.py"
          replace(
              path,
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\n",
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\nfrom agentic_lab.application.action_approver_authorization import (\n    StaticActionApproverAuthorizationPolicy,\n)\n",
          )
          marker = "def _runtime(\n    executor: InMemoryFindingAcknowledgementExecutor,\n) -> GovernedActionRuntime:\n"
          helper = '''def _approver_authorizer() -> StaticActionApproverAuthorizationPolicy:\n    return StaticActionApproverAuthorizationPolicy(\n        {\n            (\n                "soc-reviewer",\n                REMEDIATION_AGENT,\n                "trusted_composition",\n                "acknowledge_finding",\n                FINDING_RESOURCE,\n                "production",\n            ): "allow"\n        }\n    )\n\n\n'''
          replace(path, marker, helper + marker)
          replace(
              path,
              "        approval_clock=FixedApprovalClock(VALID_NOW),\n    )\n",
              "        approval_clock=FixedApprovalClock(VALID_NOW),\n        approver_authorizer=_approver_authorizer(),\n    )\n",
              count=3,
          )
          replace(
              path,
              "        approval_clock=FixedApprovalClock(EXPIRES_AT),\n    )\n",
              "        approval_clock=FixedApprovalClock(EXPIRES_AT),\n        approver_authorizer=_approver_authorizer(),\n    )\n",
          )
          insertion = '''\n\ndef test_unentitled_human_approver_cannot_authorize_mutation() -> None:\n    """Reject exact live approval when the trusted approver lacks exact entitlement."""\n    executor = InMemoryFindingAcknowledgementExecutor([FINDING_RESOURCE])\n    proposed_action = _action(environment="production")\n    context = _context()\n    approval = HumanApprovalEvidence(\n        approval_id="approval-unentitled-001",\n        approver_id="unprivileged-reviewer",\n        proposed_action=proposed_action,\n        context=context,\n        approved_at=APPROVED_AT,\n        expires_at=EXPIRES_AT,\n    )\n    runtime = GovernedActionRuntime(\n        authorizer=_policy(),\n        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n        approval_clock=FixedApprovalClock(VALID_NOW),\n        approver_authorizer=_approver_authorizer(),\n    )\n\n    first = runtime.execute(proposed_action, context)\n    retry = runtime.execute(proposed_action, context)\n\n    assert first.authorization.outcome == "require_human_approval"\n    assert first.approval_status == "unauthorized_approver"\n    assert first.approver_authorization is not None\n    assert first.approver_authorization.outcome == "deny"\n    assert first.approver_authorization.reason == "no_matching_rule"\n    assert first.execution_occurred is False\n    assert retry.approval_status == "missing"\n    assert executor.execution_count == 0\n    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n'''
          anchor = "\ndef test_tool_substitution_is_authorized_as_the_actual_proposed_action() -> None:\n"
          replace(path, anchor, insertion + anchor)

          # Process-local concurrent runtime proof.
          path = "tests/integration/test_concurrent_governed_action_approval.py"
          replace(
              path,
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\n",
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\nfrom agentic_lab.application.action_approver_authorization import (\n    StaticActionApproverAuthorizationPolicy,\n)\n",
          )
          replace(
              path,
              "        approval_clock=FixedApprovalClock(),\n    )\n",
              '''        approval_clock=FixedApprovalClock(),\n        approver_authorizer=StaticActionApproverAuthorizationPolicy(\n            {\n                (\n                    "soc-reviewer",\n                    context.caller_id,\n                    context.identity_source,\n                    proposed_action.action,\n                    proposed_action.resource,\n                    proposed_action.environment,\n                ): "allow"\n            }\n        ),\n    )\n''',
          )
          replace(
              path,
              '    assert statuses.count("missing") == participants - 1\n',
              '    assert statuses.count("missing") == participants - 1\n    validated = next(item for item in evidence if item.approval_status == "validated")\n    assert validated.approver_authorization is not None\n    assert validated.approver_authorization.outcome == "allow"\n',
          )

          # Cross-framework conformance: explicit entitlement plus unauthorized reviewer scenario.
          path = "tests/integration/test_governed_action_framework_conformance.py"
          replace(
              path,
              "from agentic_lab.application.action_approval import ApprovalStatus, HumanApprovalEvidence\n",
              "from agentic_lab.application.action_approval import ApprovalStatus, HumanApprovalEvidence\nfrom agentic_lab.application.action_approver_authorization import (\n    StaticActionApproverAuthorizationPolicy,\n)\n",
          )
          replace(
              path,
              "    expected_execution: bool\n    approval_expires_at: datetime | None = None\n",
              '    expected_execution: bool\n    approver_id: str = "security-reviewer"\n    approval_expires_at: datetime | None = None\n',
          )
          anchor = '''    _Scenario(\n        name="approval-expired",\n'''
          scenario = '''    _Scenario(\n        name="approver-unauthorized",\n        proposed_action=_action(environment="production"),\n        context=ActionContext(caller_id=_ALLOWED_CALLER),\n        with_approval=True,\n        expected_outcome="require_human_approval",\n        expected_reason="human_approval_required",\n        expected_approval_status="unauthorized_approver",\n        expected_execution=False,\n        approver_id="unprivileged-reviewer",\n    ),\n'''
          replace(path, anchor, scenario + anchor)
          replace(
              path,
              '                approver_id="security-reviewer",\n',
              "                approver_id=scenario.approver_id,\n",
          )
          replace(
              path,
              "        approval_clock=FixedApprovalClock(),\n    )\n",
              '''        approval_clock=FixedApprovalClock(),\n        approver_authorizer=StaticActionApproverAuthorizationPolicy(\n            {\n                (\n                    "security-reviewer",\n                    _ALLOWED_CALLER,\n                    "trusted_composition",\n                    ACKNOWLEDGE_FINDING_ACTION,\n                    _FINDING_RESOURCE,\n                    "production",\n                ): "allow"\n            }\n        ),\n    )\n''',
          )

          # Component integration validated path.
          path = "tests/integration/test_governed_finding_action.py"
          replace(
              path,
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\n",
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\nfrom agentic_lab.application.action_approver_authorization import (\n    StaticActionApproverAuthorizationPolicy,\n)\n",
          )
          needle = "        approval_clock=FixedApprovalClock(),\n    )\n\n    evidence = runtime.execute(proposed_action, context)\n"
          replacement = '''        approval_clock=FixedApprovalClock(),\n        approver_authorizer=StaticActionApproverAuthorizationPolicy(\n            {\n                (\n                    "soc-reviewer",\n                    REMEDIATION_AGENT,\n                    "trusted_composition",\n                    "acknowledge_finding",\n                    FINDING_RESOURCE,\n                    "production",\n                ): "allow"\n            }\n        ),\n    )\n\n    evidence = runtime.execute(proposed_action, context)\n'''
          replace(path, needle, replacement)

          # LangGraph unit proof: runtime still owns both HITL and approver authorization.
          path = "tests/unit/adapters/langgraph/test_action_graph_approval.py"
          replace(
              path,
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\n",
              "from agentic_lab.application.action_approval import HumanApprovalEvidence\nfrom agentic_lab.application.action_approver_authorization import (\n    StaticActionApproverAuthorizationPolicy,\n)\n",
          )
          replace(
              path,
              "        approval_clock=FixedApprovalClock(),\n    )\n",
              '''        approval_clock=FixedApprovalClock(),\n        approver_authorizer=StaticActionApproverAuthorizationPolicy(\n            {\n                (\n                    "soc-reviewer",\n                    REMEDIATION_AGENT,\n                    "trusted_composition",\n                    "acknowledge_finding",\n                    FINDING_RESOURCE,\n                    "production",\n                ): "allow"\n            }\n        ),\n    )\n''',
          )
          replace(
              path,
              '    assert evidence.human_approval == approval\n',
              '    assert evidence.human_approval == approval\n    assert evidence.approver_authorization is not None\n    assert evidence.approver_authorization.outcome == "allow"\n',
          )
          PY

      - name: Verify patch shape
        run: |
          git diff --check
          git diff --name-only
          test -z "$(git diff --name-only | grep -Ev '^(tests/)' || true)"

      - name: Commit migrated fixtures
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests
          git commit -m "test: migrate approval fixtures to explicit approver policy"
          git push origin HEAD:feat/phase-47-approver-authorization
