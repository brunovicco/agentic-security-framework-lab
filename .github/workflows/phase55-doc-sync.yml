name: phase55-doc-sync

on:
  push:
    branches:
      - docs/phase-55-current-capabilities
    paths:
      - scripts/phase55_sync_docs.py
      - .github/workflows/phase55-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Update current capability documentation
        run: python scripts/phase55_sync_docs.py
      - name: Guard documentation scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            README.md
            README.pt-br.md
            docs/AGENTIC_FAST_TRACK.md
            docs/ARCHITECTURE.md
            docs/DEVELOPMENT.md
            docs/EXECUTIVE_OVERVIEW.md
            docs/FRAMEWORK_DECISION_MATRIX.md
            docs/MCP.md
            docs/README.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
      - name: Commit documentation only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.pt-br.md docs/AGENTIC_FAST_TRACK.md docs/ARCHITECTURE.md docs/DEVELOPMENT.md docs/EXECUTIVE_OVERVIEW.md docs/FRAMEWORK_DECISION_MATRIX.md docs/MCP.md docs/README.md
          git diff --cached --check
          git commit -m "docs: align portfolio docs with current governed runtime"
          git push
