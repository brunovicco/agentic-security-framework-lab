name: phase49-doc-format

on:
  push:
    branches:
      - feat/phase-49-executor-failure-evidence
    paths:
      - .github/workflows/phase49-doc-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-49-executor-failure-evidence
      - name: Normalize canonical security prose
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/security/GOVERNED_AGENT_ACTIONS.md")
          text = path.read_text()
          old = (
              "Likewise, policy can authorize a scope while the concrete executor can still fail because the target resource does not exist.\n"
              " In that case the governed failure records that execution was attempted and keeps the external side-effect result `unknown` rather than misreporting a clean non-execution.\n"
          )
          new = (
              "Likewise, policy can authorize a scope while the concrete executor can still fail because the target resource does not exist.\n\n"
              "In that case the governed failure records that execution was attempted and keeps the external side-effect result `unknown` rather than misreporting a clean non-execution.\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one prose target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/security/GOVERNED_AGENT_ACTIONS.md"
      - name: Commit documentation formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/security/GOVERNED_AGENT_ACTIONS.md
          git commit -m "docs: normalize executor failure prose"
          git push origin HEAD:feat/phase-49-executor-failure-evidence
