name: phase53-doc-sync

on:
  push:
    branches:
      - fix/phase-53-agno-governed-failure-evidence
    paths:
      - .github/workflows/phase53-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Update only Phase 53 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          hardened_anchor = "- The trusted-composition governed MCP mutable boundary now applies the same fail-closed transport classification to post-executor `GovernedActionExecutionError`, preserving safe action-level failure evidence while keeping raw executor text out of MCP protocol data."
          changelog = replace_once(
              changelog,
              hardened_anchor,
              hardened_anchor
              + "\n- Agno governed mutable execution now preserves the original `GovernedActionExecutionError` across `RunStatus.error` instead of replacing application-owned failure provenance with a generic framework error; the existing `max_retries=0` boundary remains unchanged.",
              "CHANGELOG hardened",
          )
          evidence_anchor = "- The MCP protocol guard removes this failure class from the normal model-correctable Tool-result channel; it does not prove that every host will avoid programmatic retry and does not provide idempotency, rollback, compensation, or distributed transaction semantics."
          changelog = replace_once(
              changelog,
              evidence_anchor,
              evidence_anchor
              + "\n- Agno failure regression coverage proves a mutable executor is attempted exactly once and callers receive the original governed failure evidence with exact context/action/authorization, `execution_attempted=true`, `failure_reason=executor_error`, and `external_side_effect_state=unknown`; raw executor text remains only in the local exception cause.",
              "CHANGELOG evidence",
          )
          changelog_path.write_text(changelog)

          security_path = Path("docs/security/GOVERNED_AGENT_ACTIONS.md")
          security = security_path.read_text()
          old_section = """### Agno retry hardening

The Agno mutable step explicitly uses `max_retries=0` and fail-closed step behavior.

This is security-relevant because an implicit framework retry around a mutating executor could multiply side effects after a partial failure.

A regression test uses a failing executor and proves it is invoked exactly once.
"""
          new_section = """### Agno retry and failure-provenance hardening

The Agno mutable step explicitly uses `max_retries=0` and fail-closed step behavior.

This is security-relevant because an implicit framework retry around a mutating executor could multiply side effects after a partial failure. The zero-retry setting therefore remains explicit even though authorization and executor-failure semantics belong to the application runtime rather than Agno.

A second boundary matters after that one allowed attempt fails. `GovernedActionRuntime` raises `GovernedActionExecutionError` with `ActionExecutionFailureEvidence`, but Agno represents the workflow itself as `RunStatus.error`. The adapter must not replace the application-owned governed failure with a new generic framework error merely because the workflow status is error.

The Agno adapter therefore captures only `GovernedActionExecutionError` while the Step is executing and, when the Workflow reports `RunStatus.error`, re-raises that same governed exception. Non-governed Agno failures still use the adapter's generic framework error path.

This preserves two independent facts:

```text
Agno mutable executor failure
    -> exactly one executor invocation
    -> original GovernedActionExecutionError survives
    -> ActionExecutionFailureEvidence remains inspectable
```

Regression coverage requires the exact caller context, proposed action and authorization evidence, `execution_attempted=true`, `failure_reason=executor_error`, and `external_side_effect_state=unknown`. Raw executor exception text remains excluded from structured evidence and the governed error message; it remains available only as the local Python exception cause.

This does not make Agno the owner of failure semantics and does not add retry, idempotency, rollback, compensation, or transaction guarantees.
"""
          security = replace_once(
              security,
              old_section,
              new_section,
              "security Agno hardening section",
          )
          security_path.write_text(security)
          PY
      - name: Guard documentation scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            CHANGELOG.md
            docs/security/GOVERNED_AGENT_ACTIONS.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
      - name: Commit documentation only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/security/GOVERNED_AGENT_ACTIONS.md
          git diff --cached --check
          git commit -m "docs: document Agno governed failure provenance"
          git push
