name: phase41-migration-sync

on:
  push:
    branches:
      - fix/phase-41-approval-freshness
    paths:
      - .github/workflows/phase41-migration-sync.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/phase-41-approval-freshness
      - name: Apply exact approval freshness migration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          # Ruff UP017: use datetime.UTC consistently.
          replace_once(
              "src/agentic_lab/application/action_approval.py",
              "from datetime import datetime, timezone",
              "from datetime import UTC, datetime",
          )
          replace_once(
              "src/agentic_lab/application/action_approval.py",
              "return datetime.now(timezone.utc)",
              "return datetime.now(UTC)",
          )
          for path in (
              "tests/unit/adapters/test_action_approvals.py",
              "tests/unit/application/test_action_approval.py",
              "tests/unit/application/test_action_runtime.py",
          ):
              replace_once(
                  path,
                  "from datetime import datetime, timedelta, timezone",
                  "from datetime import UTC, datetime, timedelta",
              )
              replace_once(path, "tzinfo=timezone.utc", "tzinfo=UTC")

          # Adversarial suite: preserve replay coverage and add stale-approval attack coverage.
          path = "tests/integration/test_adversarial_action_authorization.py"
          replace_once(
              path,
              "import pytest\n",
              "from datetime import UTC, datetime, timedelta\n\nimport pytest\n",
          )
          replace_once(
              path,
              'OBSERVER_AGENT = "observer-agent"\n',
              'OBSERVER_AGENT = "observer-agent"\nAPPROVED_AT = datetime(2026, 9, 5, 20, 0, tzinfo=UTC)\nEXPIRES_AT = APPROVED_AT + timedelta(minutes=15)\nVALID_NOW = APPROVED_AT + timedelta(minutes=5)\n',
          )
          replace_once(
              path,
              'class CountingActionAuthorizer:\n',
              'class FixedApprovalClock:\n    """Return deterministic trusted time for adversarial approval checks."""\n\n    def __init__(self, current_time: datetime) -> None:\n        self._current_time = current_time\n\n    def now(self) -> datetime:\n        """Return the configured timezone-aware current time."""\n        return self._current_time\n\n\nclass CountingActionAuthorizer:\n',
          )
          replace_once(
              path,
              '        proposed_action=proposed_action,\n        context=context,\n    )\n    runtime = GovernedActionRuntime(\n        authorizer=_policy(),\n        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n    )\n\n    first = runtime.execute(proposed_action, context)\n',
              '        proposed_action=proposed_action,\n        context=context,\n        approved_at=APPROVED_AT,\n        expires_at=EXPIRES_AT,\n    )\n    runtime = GovernedActionRuntime(\n        authorizer=_policy(),\n        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n        approval_clock=FixedApprovalClock(VALID_NOW),\n    )\n\n    first = runtime.execute(proposed_action, context)\n',
          )
          replay_anchor = '''    assert executor.execution_count == 1\n    assert executor.is_acknowledged(FINDING_RESOURCE) is True\n\n\ndef test_tool_substitution_is_authorized_as_the_actual_proposed_action() -> None:\n'''
          stale_test = '''    assert executor.execution_count == 1\n    assert executor.is_acknowledged(FINDING_RESOURCE) is True\n\n\ndef test_stale_unused_human_approval_cannot_authorize_late_mutation() -> None:\n    """Treat old unconsumed human intent as expired authority, then consume it."""\n    executor = InMemoryFindingAcknowledgementExecutor([FINDING_RESOURCE])\n    proposed_action = _action(environment="production")\n    context = _context()\n    approval = HumanApprovalEvidence(\n        approval_id="approval-stale-001",\n        approver_id="soc-reviewer",\n        proposed_action=proposed_action,\n        context=context,\n        approved_at=APPROVED_AT,\n        expires_at=EXPIRES_AT,\n    )\n    runtime = GovernedActionRuntime(\n        authorizer=_policy(),\n        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n        approval_clock=FixedApprovalClock(EXPIRES_AT),\n    )\n\n    stale = runtime.execute(proposed_action, context)\n    retry = runtime.execute(proposed_action, context)\n\n    assert stale.authorization.outcome == "require_human_approval"\n    assert stale.approval_status == "expired"\n    assert stale.human_approval == approval\n    assert stale.execution_occurred is False\n    assert retry.approval_status == "missing"\n    assert retry.execution_occurred is False\n    assert executor.execution_count == 0\n    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n\n\ndef test_tool_substitution_is_authorized_as_the_actual_proposed_action() -> None:\n'''
          replace_once(path, replay_anchor, stale_test)

          # Cross-framework conformance: all adapters must preserve expired approval semantics.
          path = "tests/integration/test_governed_action_framework_conformance.py"
          replace_once(
              path,
              "from dataclasses import dataclass\n\nimport pytest\n",
              "from dataclasses import dataclass\nfrom datetime import UTC, datetime, timedelta\n\nimport pytest\n",
          )
          replace_once(
              path,
              '_ALLOWED_CALLER = "remediation-agent"\n',
              '_ALLOWED_CALLER = "remediation-agent"\n_APPROVED_AT = datetime(2026, 9, 5, 20, 0, tzinfo=UTC)\n_NOW = _APPROVED_AT + timedelta(minutes=5)\n_EXPIRES_AT = _APPROVED_AT + timedelta(minutes=15)\n',
          )
          replace_once(
              path,
              '    expected_approval_status: ApprovalStatus\n    expected_execution: bool\n',
              '    expected_approval_status: ApprovalStatus\n    expected_execution: bool\n    approval_expires_at: datetime | None = None\n',
          )
          validated_scenario = '''    _Scenario(\n        name="approval-validated",\n        proposed_action=_action(environment="production"),\n        context=ActionContext(caller_id=_ALLOWED_CALLER),\n        with_approval=True,\n        expected_outcome="require_human_approval",\n        expected_reason="human_approval_required",\n        expected_approval_status="validated",\n        expected_execution=True,\n    ),\n'''
          replace_once(
              path,
              validated_scenario,
              validated_scenario + '''    _Scenario(\n        name="approval-expired",\n        proposed_action=_action(environment="production"),\n        context=ActionContext(caller_id=_ALLOWED_CALLER),\n        with_approval=True,\n        expected_outcome="require_human_approval",\n        expected_reason="human_approval_required",\n        expected_approval_status="expired",\n        expected_execution=False,\n        approval_expires_at=_NOW,\n    ),\n''',
          )
          replace_once(
              path,
              '''def _runtime(\n    executor: InMemoryFindingAcknowledgementExecutor,\n    scenario: _Scenario,\n) -> GovernedActionRuntime:\n''',
              '''class FixedApprovalClock:\n    """Return deterministic application time for framework conformance."""\n\n    def now(self) -> datetime:\n        """Return the fixed current time shared by baseline and adapters."""\n        return _NOW\n\n\ndef _runtime(\n    executor: InMemoryFindingAcknowledgementExecutor,\n    scenario: _Scenario,\n) -> GovernedActionRuntime:\n''',
          )
          replace_once(
              path,
              '''                proposed_action=scenario.proposed_action,\n                context=scenario.context,\n            ),\n''',
              '''                proposed_action=scenario.proposed_action,\n                context=scenario.context,\n                approved_at=_APPROVED_AT,\n                expires_at=scenario.approval_expires_at or _EXPIRES_AT,\n            ),\n''',
          )
          replace_once(
              path,
              '''        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider(approvals),\n    )\n''',
              '''        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider(approvals),\n        approval_clock=FixedApprovalClock(),\n    )\n''',
          )

          # Component integration approval: deterministic valid window.
          path = "tests/integration/test_governed_finding_action.py"
          replace_once(
              path,
              "import pytest\n",
              "from datetime import UTC, datetime, timedelta\n\nimport pytest\n",
          )
          replace_once(
              path,
              'REMEDIATION_AGENT = "remediation-agent"\n',
              'REMEDIATION_AGENT = "remediation-agent"\nAPPROVED_AT = datetime(2026, 9, 5, 20, 0, tzinfo=UTC)\nVALID_NOW = APPROVED_AT + timedelta(minutes=5)\nEXPIRES_AT = APPROVED_AT + timedelta(minutes=15)\n\n\nclass FixedApprovalClock:\n    """Return deterministic trusted time for component integration."""\n\n    def now(self) -> datetime:\n        """Return one valid instant inside the approval window."""\n        return VALID_NOW\n',
          )
          replace_once(
              path,
              '''        proposed_action=proposed_action,\n        context=context,\n    )\n    rules: dict[ActionAuthorizationRuleKey, AuthorizationOutcome] = {\n''',
              '''        proposed_action=proposed_action,\n        context=context,\n        approved_at=APPROVED_AT,\n        expires_at=EXPIRES_AT,\n    )\n    rules: dict[ActionAuthorizationRuleKey, AuthorizationOutcome] = {\n''',
          )
          replace_once(
              path,
              '''        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n    )\n\n    evidence = runtime.execute(proposed_action, context)\n''',
              '''        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n        approval_clock=FixedApprovalClock(),\n    )\n\n    evidence = runtime.execute(proposed_action, context)\n''',
          )

          # LangGraph regression: graph delegates temporal approval authority to runtime.
          path = "tests/unit/adapters/langgraph/test_action_graph_approval.py"
          replace_once(
              path,
              '"""LangGraph regression proving trusted approval stays runtime-owned."""\n\n',
              '"""LangGraph regression proving trusted approval stays runtime-owned."""\n\nfrom datetime import UTC, datetime, timedelta\n\n',
          )
          replace_once(
              path,
              'REMEDIATION_AGENT = "remediation-agent"\n',
              'REMEDIATION_AGENT = "remediation-agent"\nAPPROVED_AT = datetime(2026, 9, 5, 20, 0, tzinfo=UTC)\nVALID_NOW = APPROVED_AT + timedelta(minutes=5)\nEXPIRES_AT = APPROVED_AT + timedelta(minutes=15)\n\n\nclass FixedApprovalClock:\n    """Return deterministic trusted time while LangGraph delegates enforcement."""\n\n    def now(self) -> datetime:\n        """Return one valid instant inside the approval window."""\n        return VALID_NOW\n',
          )
          replace_once(
              path,
              '''        proposed_action=proposed_action,\n        context=context,\n    )\n    rules: dict[ActionAuthorizationRuleKey, AuthorizationOutcome] = {\n''',
              '''        proposed_action=proposed_action,\n        context=context,\n        approved_at=APPROVED_AT,\n        expires_at=EXPIRES_AT,\n    )\n    rules: dict[ActionAuthorizationRuleKey, AuthorizationOutcome] = {\n''',
          )
          replace_once(
              path,
              '''        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n    )\n\n    output = run_governed_action_graph(runtime, context, proposed_action)\n''',
              '''        executor=executor,\n        approval_provider=InMemoryActionApprovalProvider([approval]),\n        approval_clock=FixedApprovalClock(),\n    )\n\n    output = run_governed_action_graph(runtime, context, proposed_action)\n''',
          )
          PY
      - name: Format and commit only expected migration files
        run: |
          python -m pip install ruff==0.16.5
          ruff format \
            src/agentic_lab/application/action_approval.py \
            tests/unit/adapters/test_action_approvals.py \
            tests/unit/application/test_action_approval.py \
            tests/unit/application/test_action_runtime.py \
            tests/integration/test_adversarial_action_authorization.py \
            tests/integration/test_governed_action_framework_conformance.py \
            tests/integration/test_governed_finding_action.py \
            tests/unit/adapters/langgraph/test_action_graph_approval.py
          git diff --check
          git diff --exit-code -- . \
            ':!src/agentic_lab/application/action_approval.py' \
            ':!tests/unit/adapters/test_action_approvals.py' \
            ':!tests/unit/application/test_action_approval.py' \
            ':!tests/unit/application/test_action_runtime.py' \
            ':!tests/integration/test_adversarial_action_authorization.py' \
            ':!tests/integration/test_governed_action_framework_conformance.py' \
            ':!tests/integration/test_governed_finding_action.py' \
            ':!tests/unit/adapters/langgraph/test_action_graph_approval.py'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/agentic_lab/application/action_approval.py \
            tests/unit/adapters/test_action_approvals.py \
            tests/unit/application/test_action_approval.py \
            tests/unit/application/test_action_runtime.py \
            tests/integration/test_adversarial_action_authorization.py \
            tests/integration/test_governed_action_framework_conformance.py \
            tests/integration/test_governed_finding_action.py \
            tests/unit/adapters/langgraph/test_action_graph_approval.py
          git commit -m "test: migrate approval freshness consumers"
          git push origin HEAD:fix/phase-41-approval-freshness
