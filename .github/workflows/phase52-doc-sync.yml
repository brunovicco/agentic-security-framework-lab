name: phase52-doc-sync

on:
  push:
    branches:
      - fix/phase-52-governed-mcp-uncertain-execution-failure
    paths:
      - .github/workflows/phase52-doc-sync.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Update only Phase 52 documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(text.replace(old, new, 1))

          def insert_after(path: Path, anchor: str, addition: str, label: str) -> None:
              replace_once(path, anchor, anchor + addition, label)

          changelog = Path("CHANGELOG.md")
          hardened = (
              "- Authenticated MCP mutable execution now maps only post-executor "
              "`AuthenticatedGovernedActionExecutionError` states to host-visible `MCPError` "
              "protocol failures, preventing an uncertain side-effect outcome from becoming an "
              "ordinary model-visible Tool error that invites self-directed retry."
          )
          insert_after(
              changelog,
              hardened,
              "\n- The trusted-composition governed MCP mutable boundary now applies the same "
              "fail-closed transport classification to post-executor "
              "`GovernedActionExecutionError`, preserving safe action-level failure evidence "
              "while keeping raw executor text out of MCP protocol data.",
              "CHANGELOG hardened",
          )
          authenticated_evidence = (
              "- Exact isolated `mcp[cli]==2.1.1` compatibility and real STDIO checks prove "
              "uncertain authenticated mutable execution raises a protocol `MCPError`, not "
              "`CallToolResult(is_error=true)`, while preserving safe authenticated failure "
              "evidence in error `data`, zero observed fixture mutation for the failing resource, "
              "and a subsequent valid mutation."
          )
          insert_after(
              changelog,
              authenticated_evidence,
              "\n- Governed trusted-composition MCP compatibility and real STDIO checks prove "
              "the same protocol-error boundary for action-level executor failure: safe "
              "`ActionExecutionFailureEvidence` remains in error `data`, the controlled failing "
              "resource shows zero observed fixture mutation without rewriting "
              "`external_side_effect_state=unknown`, and a subsequent valid mutation succeeds.",
              "CHANGELOG evidence",
          )

          adr = Path("docs/adr/0007-route-mutable-mcp-tools-through-governed-runtime.md")
          no_retry = (
              "This does not create a universal no-retry guarantee. A host can still choose to "
              "retry protocol errors in its own code. The boundary only prevents this uncertain "
              "mutable outcome from being delivered through the normal model-visible Tool-result "
              "error channel. No idempotency key, rollback, compensation, two-phase commit, or "
              "distributed transaction is introduced."
          )
          insert_after(
              adr,
              no_retry,
              "\n\nPhase 52 applies the same transport classification to the existing local "
              "trusted-composition governed server. It catches only "
              "`GovernedActionExecutionError`, maps it to `MCPError(INTERNAL_ERROR)`, and "
              "serializes safe `ActionExecutionFailureEvidence` under "
              "`data.execution_failure`. The application still owns authorization and failure "
              "semantics; this adapter mapping adds no policy and does not infer that a zero "
              "mutation observed in the controlled fixture changes the external side-effect "
              "state from `unknown`.",
              "ADR Phase 52 decision",
          )
          consequence = (
              "- MCP protocol failure data preserves safe authenticated governed evidence "
              "without raw credential or raw executor-error content."
          )
          insert_after(
              adr,
              consequence,
              "\n- the trusted-composition governed variant preserves safe action-level failure "
              "evidence without raw executor-error content.",
              "ADR security consequence",
          )
          phase51 = (
              "Phase 51 adds provider-free MCP v2.1.1 protocol-failure evidence for the "
              "authenticated local STDIO boundary: compatibility and real subprocess checks prove "
              "the uncertain post-executor path raises `MCPError`, carries safe structured failure "
              "`data`, produces no observed mutation in the controlled missing-resource fixture, "
              "and does not appear as a normal model-visible Tool error. This is not proof that an "
              "external side effect could not have partially or fully committed, nor that a host "
              "will never retry a protocol error."
          )
          insert_after(
              adr,
              phase51,
              "\n\nPhase 52 extends that provider-free MCP v2.1.1 protocol-failure evidence "
              "to the trusted-composition governed STDIO boundary. Compatibility and real "
              "subprocess checks prove `GovernedActionExecutionError` arrives as `MCPError` with "
              "safe `ActionExecutionFailureEvidence`, not as a normal model-visible Tool error; "
              "zero observed fixture mutation remains separate from the runtime's deliberately "
              "`unknown` external side-effect state.",
              "ADR Phase 52 evidence",
          )

          security = Path("docs/security/GOVERNED_AGENT_ACTIONS.md")
          old_intro = (
              "A post-executor failure needs different transport semantics from a normal "
              "model-correctable Tool error. If an authenticated governed executor raises after "
              "invocation, `AuthenticatedGovernedActionExecutionError` says the execution was "
              "attempted but the external side-effect state is `unknown`. Treating that as an "
              "ordinary MCP Tool result with `is_error=true` would put the failure into the "
              "channel a model can use for self-correction and retry."
          )
          new_intro = (
              "A post-executor failure needs different transport semantics from a normal "
              "model-correctable Tool error. If either governed executor raises after invocation, "
              "its typed failure evidence says execution was attempted but the external "
              "side-effect state is `unknown`. Treating that as an ordinary MCP Tool result with "
              "`is_error=true` would put the failure into the channel a model can use for "
              "self-correction and retry."
          )
          replace_once(security, old_intro, new_intro, "security uncertain failure intro")
          insert_after(
              security,
              new_intro,
              "\n\nThe trusted-composition governed MCP handler maps only "
              "`GovernedActionExecutionError` to `MCPError(INTERNAL_ERROR)` with a generic "
              "message and safe `ActionExecutionFailureEvidence` under "
              "`data.execution_failure`. Raw executor exception text is not copied into that "
              "protocol data.",
              "security trusted-composition mapping",
          )
          authenticated_check = (
              "The exact isolated MCP 2.1.1 compatibility check and real STDIO smoke prove the "
              "client receives `MCPError`, not `CallToolResult(is_error=true)`, for the controlled "
              "authorized missing-resource case. The separate state Tool observes zero fixture "
              "mutations for that case, and a later valid action still executes exactly once. "
              "Zero observed fixture mutation is not used to rewrite the runtime's `unknown` "
              "external side-effect evidence."
          )
          insert_after(
              security,
              authenticated_check,
              "\n\nThe trusted-composition governed MCP compatibility check and real STDIO "
              "smoke prove the same protocol boundary with action-level failure evidence. Its "
              "controlled missing-resource case is explicitly authorized so the executor is "
              "invoked before it raises; the separately observed zero mutation likewise does not "
              "rewrite `external_side_effect_state=unknown`, and a subsequent valid mutation "
              "still succeeds.",
              "security Phase 52 evidence",
          )
          old_proof = (
              "This proves local host-injected service authentication and fail-closed "
              "uncertain-execution transport behavior across a real MCP v2 STDIO subprocess. It "
              "does not prove remote MCP identity propagation, transport-bound authentication, "
              "OAuth/OIDC/JWT/mTLS, production secret management, or end-user identity."
          )
          new_proof = (
              "Together these checks prove fail-closed uncertain-execution transport behavior "
              "across both local governed MCP v2 STDIO boundaries. The authenticated variant "
              "additionally proves local host-injected service authentication. Neither proves "
              "remote MCP identity propagation, transport-bound authentication, "
              "OAuth/OIDC/JWT/mTLS, production secret management, or end-user identity."
          )
          replace_once(security, old_proof, new_proof, "security proof scope")
          old_invariants = (
              "27. **An authenticated post-executor failure with unknown side-effect state must "
              "not be returned through the normal model-visible MCP Tool-error result channel.**\n"
              "28. **MCP protocol failure evidence must not copy raw caller credentials or raw "
              "executor exception text.**"
          )
          new_invariants = (
              "27. **A governed post-executor failure with unknown side-effect state must not be "
              "returned through the normal model-visible MCP Tool-error result channel.**\n"
              "28. **MCP protocol failure evidence must not copy raw caller credentials or raw "
              "executor exception text.**\n"
              "29. **Zero observed fixture mutation must not rewrite an uncertain post-executor "
              "side-effect state from `unknown`.**"
          )
          replace_once(security, old_invariants, new_invariants, "security invariants")
          PY
      - name: Guard documentation scope
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            CHANGELOG.md
            docs/adr/0007-route-mutable-mcp-tools-through-governed-runtime.md
            docs/security/GOVERNED_AGENT_ACTIONS.md
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
      - name: Commit documentation only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md \
            docs/adr/0007-route-mutable-mcp-tools-through-governed-runtime.md \
            docs/security/GOVERNED_AGENT_ACTIONS.md
          git diff --cached --check
          git commit -m "docs: document uniform governed MCP failure boundary"
          git push
