name: phase45-release-sync

on:
  push:
    branches:
      - release/v1.3.0-human-approval-lifecycle
    paths:
      - .github/workflows/phase45-release-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: release/v1.3.0-human-approval-lifecycle
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.28
      - name: Prepare v1.3.0 metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "pyproject.toml",
              'version = "1.2.0"\n',
              'version = "1.3.0"\n',
          )
          replace_once(
              "uv.lock",
              'name = "agentic-security-framework-lab"\nversion = "1.2.0"\nsource = { editable = "." }\n',
              'name = "agentic-security-framework-lab"\nversion = "1.3.0"\nsource = { editable = "." }\n',
          )
          replace_once(
              "CHANGELOG.md",
              "## Unreleased\n",
              "## 1.3.0 - 2026-09-05\n",
          )
          PY
      - name: Verify release-only delta
        run: |
          uv lock --check
          git diff --check
          git diff --exit-code -- . \
            ':!CHANGELOG.md' \
            ':!pyproject.toml' \
            ':!uv.lock'
          test "$(git diff --numstat -- pyproject.toml | awk '{print $1 ":" $2}')" = "1:1"
          test "$(git diff --numstat -- uv.lock | awk '{print $1 ":" $2}')" = "1:1"
          git diff -- pyproject.toml uv.lock CHANGELOG.md
      - name: Commit release metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md pyproject.toml uv.lock
          git commit -m "chore: prepare v1.3.0 release metadata"
          git push origin HEAD:release/v1.3.0-human-approval-lifecycle
