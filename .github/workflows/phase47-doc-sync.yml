name: phase47-doc-sync

on:
  push:
    branches:
      - feat/phase-47-approver-authorization
    paths:
      - .github/workflows/phase47-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/phase-47-approver-authorization
      - name: Sync Phase 47 docs and formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}: {old!r}")
              file.write_text(text.replace(old, new, count))

          # Exact Ruff formatting delta from CI #423.
          replace(
              "tests/integration/test_adversarial_action_authorization.py",
              "    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n\ndef test_tool_substitution_is_authorized_as_the_actual_proposed_action() -> None:\n",
              "    assert executor.is_acknowledged(FINDING_RESOURCE) is False\n\n\ndef test_tool_substitution_is_authorized_as_the_actual_proposed_action() -> None:\n",
          )

          # Start a new post-v1.3 changelog section; do not modify the published v1.3 section.
          replace(
              "CHANGELOG.md",
              "# Changelog\n\n## 1.3.0 - 2026-09-05\n",
              '''# Changelog\n\n## Unreleased\n\n### Added\n\n- A framework-neutral `ActionApproverAuthorizer` independently decides whether the trusted `approver_id` named by claimed human evidence is entitled for the exact `(approver_id, caller_id, identity_source, action, resource, environment)` scope.\n- `ActionExecutionEvidence` records approver authorization separately from caller authorization and approval lifecycle evidence.\n\n### Hardened\n\n- Missing approver policy and unknown approver scope fail closed; trusted approval evidence no longer implies global approver authority.\n- Claimed approval from an unauthorized approver is consumed, blocks before freshness or mutable execution, and is recorded as `unauthorized_approver`.\n- Approver decisions and execution evidence reject contradictory outcome/reason or approval-status/approver-decision combinations.\n\n### Evidence\n\n- Deterministic unit tests cover exact allow/deny, all six scope dimensions, default fail-closed behavior, runtime ordering, and evidence consistency.\n- Adversarial coverage proves an exact, live approval from an unentitled reviewer causes zero side effects and cannot be replayed.\n- Cross-framework conformance includes `unauthorized_approver`, proving direct runtime, LangGraph, CrewAI, LlamaIndex, and Agno preserve the same application-owned decision without framework-specific HITL policy.\n- Approver authorization remains provider-free local/CI evidence; the lab does not claim human authentication, workforce IAM, signed approval attestation, role hierarchy, or multi-party approval.\n\n## 1.3.0 - 2026-09-05\n''',
          )

          adr = "docs/adr/0006-treat-human-approval-as-trusted-runtime-evidence.md"
          replace(
              adr,
              "After source-aware lifecycle isolation, one process-local concurrency gap remained: claim and revocation were compound operations across approval queues and lifecycle state without an explicit synchronization boundary. Sequential anti-replay semantics are insufficient when multiple runtime attempts can race for the same capability.\n",
              "After source-aware lifecycle isolation, one process-local concurrency gap remained: claim and revocation were compound operations across approval queues and lifecycle state without an explicit synchronization boundary. Sequential anti-replay semantics are insufficient when multiple runtime attempts can race for the same capability.\n\nAfter the lifecycle was hardened, a separate authority gap remained: trusted approval evidence identifies an `approver_id`, but provenance from a trusted approval source does not prove that this human is entitled to approve every caller/action scope. Approver identity evidence and approver authorization must remain distinct.\n",
          )
          replace(
              adr,
              "The runtime then records one of seven low-cardinality approval states:\n",
              "The runtime then records one of eight low-cardinality approval states:\n",
          )
          replace(
              adr,
              "invalid\nnot_yet_valid\n",
              "invalid\nunauthorized_approver\nnot_yet_valid\n",
          )
          anchor = "### Temporal validity\n"
          section = '''### Independent approver authorization\n\nA claimed approval is trusted evidence that a human decision was recorded; it is not by itself proof that the named human may approve the requested scope. `ActionApproverAuthorizer` is therefore a separate application port from caller authorization and from the approval provider.\n\nThe controlled `StaticActionApproverAuthorizationPolicy` evaluates one exact key:\n\n```text\n(approver_id, caller_id, identity_source, action, resource, environment)\n```\n\nRules are explicit `allow` or `deny`; an unknown key fails closed with `deny / no_matching_rule`. The default approver authorizer also denies, so configuring trusted approval evidence without approver policy cannot silently grant global approval authority. There are no wildcards, role inheritance, nearest-match rules, or model-generated approver decisions.\n\n`GovernedActionRuntime` consults approver authorization only after deterministic caller policy requires HITL, one approval has been claimed, exact action/context binding has passed, and the capability is not revoked. A deny records `unauthorized_approver` and blocks before freshness or mutable execution. Because the capability was already claimed, retry requires fresh human evidence rather than reusing approval from an unauthorized approver.\n\nThis ordering preserves independent facts:\n\n```text\ncaller authorization != trusted approval evidence != approver authorization\n```\n\nNormal caller `allow`, caller `deny`, missing approval, invalid binding, and revoked approval paths do not consult approver authorization unnecessarily. Time validation is reached only after an explicit approver allow.\n\nThe current approver identifier remains synthetic trusted lab evidence, not human authentication. This phase proves deterministic entitlement separation; it does not claim OIDC/workforce IAM, directory-backed roles, signed human attestations, self-approval controls, or multi-party/quorum workflow.\n\n'''
          replace(adr, anchor, section + anchor)
          replace(
              adr,
              "Temporal validation happens only after policy requires HITL, one approval has been claimed, and exact action/context binding has been confirmed. Normal `allow`, terminal `deny`, missing approval, and scope-mismatch paths therefore do not depend on time unnecessarily.\n",
              "Temporal validation happens only after policy requires HITL, one approval has been claimed, exact action/context binding has been confirmed, revocation has been ruled out, and the approver has been explicitly authorized. Normal `allow`, terminal `deny`, missing approval, scope-mismatch, revoked, and unauthorized-approver paths therefore do not depend on time unnecessarily.\n",
          )
          replace(
              adr,
              "- authorization outcome, approval status, and execution occurrence remain independently observable;\n",
              "- caller authorization, approval lifecycle, approver authorization, and execution occurrence remain independently observable;\n",
          )
          replace(
              adr,
              "- synthetic approver identity is not authentication proof;\n",
              "- synthetic approver identity is not authentication proof, and exact approver policy is not workforce IAM;\n",
          )
          replace(
              adr,
              "require_human_approval + missing/invalid/not-yet-valid/expired/revoked approval = no execution\n",
              "require_human_approval + missing/invalid/unauthorized-approver/not-yet-valid/expired/revoked approval = no execution\n\ntrusted approval evidence != authorized approver\n\ncaller authorization != approver authorization\n",
          )
          replace(
              adr,
              "Refs #131, #145, #163, #165, #167, #169\n",
              "Refs #131, #145, #163, #165, #167, #169, #174\n",
          )

          security = "docs/security/GOVERNED_AGENT_ACTIONS.md"
          replace(
              security,
              "This document describes the v1.1 security model for **mutable agent actions** and its v1.2 trusted-identity evolution in the Agentic Security Framework Lab.\n",
              "This document describes the v1.1 security model for **mutable agent actions**, its v1.2 trusted-identity evolution, the v1.3 human-approval lifecycle hardening, and the post-v1.3 separation of approver entitlement in the Agentic Security Framework Lab.\n",
          )
          replace(
              security,
              "human evidence approves when required\nruntime enforces\n",
              "human evidence approves when required\napprover policy authorizes the human for that exact scope\nruntime enforces\n",
          )
          replace(
              security,
              "- `invalid`\n- `not_yet_valid`\n",
              "- `invalid`\n- `unauthorized_approver`\n- `not_yet_valid`\n",
          )
          anchor = "### Approval anti-replay\n"
          section = '''### Independent approver authorization\n\nTrusted approval evidence and approver entitlement are separate facts. `HumanApprovalEvidence.approver_id` identifies the synthetic human principal recorded by the trusted HITL source, but that identifier does not grant global authority.\n\n`ActionApproverAuthorizer` independently evaluates the exact scope:\n\n```text\n(approver_id, caller_id, identity_source, action, resource, environment)\n```\n\nThe controlled static policy supports exact `allow` or `deny` only. Unknown scope and the default no-policy composition both fail closed. An approval from an unentitled approver is recorded as `unauthorized_approver`, produces zero side effects, and stays consumed because entitlement is evaluated after the single-use claim.\n\nApprover authorization is evaluated only after exact approval binding and revocation checks, but before approval freshness and execution. Therefore direct caller `allow`, terminal caller `deny`, missing approval, invalid approval, and revoked approval do not depend on approver policy.\n\n`ActionExecutionEvidence` keeps the approver decision separate from caller authorization and rejects contradictory evidence combinations. A temporal or `validated` approval state requires an explicit approver allow; `unauthorized_approver` requires an approver deny.\n\n```text\ntrusted approval evidence != authorized approver\ncaller authorization != approver authorization\n```\n\nThis is deterministic provider-free entitlement evidence. It does not implement or claim human authentication, OIDC/workforce IAM, directory-backed roles, signed approval attestations, self-approval policy, or multi-party/quorum approval.\n\n'''
          replace(security, anchor, section + anchor)
          replace(
              security,
              "    H -->|revoked| B\n    H -->|claimed exact scope| T[Validate trusted approval time]\n    T -->|not yet valid or expired| B\n    T -->|validated| X\n",
              "    H -->|revoked| B\n    H -->|claimed exact scope| R[Authorize approver for exact scope]\n    R -->|deny| B\n    R -->|allow| T[Validate trusted approval time]\n    T -->|not yet valid or expired| B\n    T -->|validated| X\n",
          )
          replace(
              security,
              "- approval status, claim lifecycle, bounded approval evidence, and temporal validity when present;\n",
              "- approval status, claim lifecycle, bounded approval evidence, approver-authorization decision, and temporal validity when present;\n",
          )
          replace(
              security,
              "None of these adapters contains its own authorization rule table or interprets an authorization outcome to decide whether execution is permitted.\n",
              "None of these adapters contains its own caller-authorization or approver-authorization rule table or interprets those outcomes to decide whether execution is permitted.\n",
          )
          replace(
              security,
              "Existing framework adapters continue to use their explicitly injected local `trusted_composition` context. Phase 37 migrates their policy fixtures to declare that source explicitly, so framework behavior cannot depend on an implicit source default inside authorization policy. API-key handling remains an application authentication concern rather than framework input.\n",
              "Existing framework adapters continue to use their explicitly injected local `trusted_composition` context. Phase 37 migrates their caller-policy fixtures to declare that source explicitly, so framework behavior cannot depend on an implicit source default inside authorization policy. Phase 47 keeps approver entitlement in the same shared application runtime; cross-framework conformance includes an unauthorized-approver scenario rather than duplicating HITL policy inside LangGraph, CrewAI, LlamaIndex, or Agno. API-key handling remains an application authentication concern rather than framework input.\n",
          )
          PY

      - name: Verify synchronized delta
        run: |
          git diff --check
          test "$(grep -c '^## 1.3.0 - 2026-09-05$' CHANGELOG.md)" = "1"
          test "$(grep -c '^## Unreleased$' CHANGELOG.md)" = "1"
          git diff --name-only

      - name: Commit Phase 47 docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md docs tests/integration/test_adversarial_action_authorization.py
          git commit -m "docs: document independent approver authorization boundary"
          git push origin HEAD:feat/phase-47-approver-authorization
